name: Build Flutter / Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      project_type:
        description: "Pilih platform build"
        required: true
        type: choice
        default: flutter
        options:
          - flutter
          - android

      build_type:
        description: "Pilih mode build"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya analyze, tanpa build"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================================================
      # DOWNLOAD ZIP
      # =========================================================
      - name: Download ZIP project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          DOWNLOAD PROJECT"
          echo "=========================================="

          echo "Platform : ${{ inputs.project_type }}"
          echo "Build    : ${{ inputs.build_type }}"
          echo "Tag      : ${{ inputs.tag }}"

          curl -fL \
            --retry 3 \
            --retry-all-errors \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}" \
            -o project.zip

          test -s project.zip

          echo ""
          echo "=== ZIP INFO ==="

          ls -lh project.zip
          file project.zip

      # =========================================================
      # VERIFY + EXTRACT ZIP
      # =========================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          VERIFY + EXTRACT ZIP"
          echo "=========================================="

          echo "=== ZIP TEST ==="

          unzip -t project.zip

          rm -rf project_raw

          mkdir -p project_raw

          echo ""
          echo "=== EXTRACTING ==="

          set +e

          unzip -o project.zip -d project_raw

          UNZIP_STATUS=$?

          set -e

          echo ""
          echo "unzip exit code: $UNZIP_STATUS"

          if [ "$UNZIP_STATUS" -ne 0 ]; then
            echo "⚠️ unzip mengembalikan warning/status $UNZIP_STATUS."
            echo "Melanjutkan karena ZIP sudah lolos unzip -t."
          fi

          FILE_COUNT=$(
            find project_raw \
              -type f \
              | wc -l \
              | tr -d ' '
          )

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Tidak ada file yang berhasil diekstrak!"
            exit 1
          fi

          echo ""
          echo "✅ File extracted: $FILE_COUNT"

          echo ""
          echo "=== PROJECT STRUCTURE ==="

          find project_raw \
            -maxdepth 5 \
            -type f \
            -print \
            | sed -n '1,250p'

      # =========================================================
      # DETECT PROJECT ROOT
      # =========================================================
      - name: Detect Project Root
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          DETECT PROJECT ROOT"
          echo "=========================================="

          PROJECT_DIR=""

          # =====================================================
          # FLUTTER
          # =====================================================
          if [ "${{ inputs.project_type }}" = "flutter" ]; then

            echo "Mencari pubspec.yaml..."

            if [ -f "project_raw/pubspec.yaml" ]; then

              PROJECT_DIR="project_raw"

            else

              PUBSPEC=$(
                find project_raw \
                  -type f \
                  -name "pubspec.yaml" \
                  -print -quit \
                  || true
              )

              if [ -n "$PUBSPEC" ]; then
                PROJECT_DIR="$(dirname "$PUBSPEC")"
              fi

            fi

          # =====================================================
          # ANDROID / CAPACITOR
          # =====================================================
          else

            echo "Mencari Android / Capacitor project..."

            # ---------------------------------------------------
            # PRIORITAS 1: CAPACITOR
            # ---------------------------------------------------

            CAP_CONFIG=$(
              find project_raw \
                -type f \
                \( \
                  -name "capacitor.config.json" \
                  -o -name "capacitor.settings.gradle" \
                  -o -name "capacitor.config.js" \
                  -o -name "capacitor.config.ts" \
                \) \
                -print -quit \
                || true
            )

            if [ -n "$CAP_CONFIG" ]; then

              PROJECT_DIR="$(dirname "$CAP_CONFIG")"

              echo ""
              echo "✅ Capacitor project ditemukan:"
              echo "$PROJECT_DIR"

            fi

            # ---------------------------------------------------
            # PRIORITAS 2: ROOT GRADLE
            # ---------------------------------------------------

            if [ -z "$PROJECT_DIR" ]; then

              echo ""
              echo "Capacitor tidak ditemukan."
              echo "Mencari Gradle project..."

              if [ -f "project_raw/gradlew" ]; then

                PROJECT_DIR="project_raw"

              else

                GRADLEW=$(
                  find project_raw \
                    -type f \
                    -name "gradlew" \
                    -print -quit \
                    || true
                )

                if [ -n "$GRADLEW" ]; then
                  PROJECT_DIR="$(dirname "$GRADLEW")"
                fi

              fi

            fi

            # ---------------------------------------------------
            # PRIORITAS 3: settings.gradle
            # ---------------------------------------------------

            if [ -z "$PROJECT_DIR" ]; then

              GRADLE_BUILD=$(
                find project_raw \
                  -type f \
                  \( \
                    -name "settings.gradle" \
                    -o -name "settings.gradle.kts" \
                  \) \
                  -print -quit \
                  || true
              )

              if [ -n "$GRADLE_BUILD" ]; then
                PROJECT_DIR="$(dirname "$GRADLE_BUILD")"
              fi

            fi

          fi

          # =====================================================
          # VALIDATE
          # =====================================================

          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "❌ PROJECT ROOT TIDAK DITEMUKAN!"

            echo ""
            echo "=== CANDIDATE FILES ==="

            find project_raw \
              -type f \
              \( \
                -name "pubspec.yaml" \
                -o -name "gradlew" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "capacitor.config.json" \
                -o -name "capacitor.settings.gradle" \
                -o -name "capacitor.config.js" \
                -o -name "capacitor.config.ts" \
              \) \
              -print \
              | sed -n '1,150p'

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # PREPARE CAPACITOR
      # =========================================================
      - name: Prepare Capacitor Android
        if: ${{ inputs.project_type == 'android' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "       PREPARE CAPACITOR ANDROID"
          echo "=========================================="

          CAP_PROJECT_DIR=""

          echo "Mencari capacitor.config.* ..."

          while IFS= read -r config; do

            DIR="$(dirname "$config")"

            if [ -f "$DIR/package.json" ]; then
              CAP_PROJECT_DIR="$DIR"
              break
            fi

          done < <(
            find project_raw \
              -type f \
              \( \
                -name "capacitor.config.json" \
                -o -name "capacitor.settings.gradle" \
                -o -name "capacitor.config.js" \
                -o -name "capacitor.config.ts" \
              \) \
              -print
          )

          # =====================================================
          # BUKAN CAPACITOR
          # =====================================================

          if [ -z "$CAP_PROJECT_DIR" ]; then

            echo ""
            echo "ℹ️ capacitor.config tidak ditemukan."
            echo "ℹ️ Project dianggap Android Gradle biasa."
            echo "ℹ️ Capacitor sync dilewati."

            exit 0

          fi

          echo ""
          echo "✅ Capacitor project ditemukan:"
          echo "$CAP_PROJECT_DIR"

          cd "$CAP_PROJECT_DIR"

          # =====================================================
          # NODE DEPENDENCIES
          # =====================================================

          echo ""
          echo "=========================================="
          echo "          NODE DEPENDENCIES"
          echo "=========================================="

          if [ -f package-lock.json ]; then

            echo "📦 package-lock.json ditemukan."
            echo "Menjalankan npm ci..."

            npm ci

          else

            echo "⚠️ package-lock.json tidak ditemukan."
            echo "Menjalankan npm install..."

            npm install

          fi

          # =====================================================
          # CAPACITOR VERSION
          # =====================================================

          echo ""
          echo "=========================================="
          echo "          CAPACITOR VERSION"
          echo "=========================================="

          npx cap --version

          # =====================================================
          # CAPACITOR SYNC
          # =====================================================

          echo ""
          echo "=========================================="
          echo "          CAPACITOR SYNC ANDROID"
          echo "=========================================="

          npx cap sync android

          # =====================================================
          # VERIFY ANDROID
          # =====================================================

          echo ""
          echo "=========================================="
          echo "       VERIFY CAPACITOR OUTPUT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project contents:"
          ls -la

          ANDROID_DIR=""

          # Normal Capacitor path
          if [ -d "$CAP_PROJECT_DIR/android" ]; then

            ANDROID_DIR="$CAP_PROJECT_DIR/android"

          else

            # Fallback cari gradlew
            FOUND_GRADLEW=$(
              find "$CAP_PROJECT_DIR" \
                -maxdepth 4 \
                -type f \
                -name "gradlew" \
                -print -quit \
                || true
            )

            if [ -n "$FOUND_GRADLEW" ]; then
              ANDROID_DIR="$(dirname "$FOUND_GRADLEW")"
            fi

          fi

          if [ -z "$ANDROID_DIR" ]; then

            echo ""
            echo "❌ Folder Android tidak ditemukan!"

            echo ""
            echo "=== CARI GRADLEW ==="

            find "$CAP_PROJECT_DIR" \
              -type f \
              -name "gradlew" \
              -print \
              || true

            echo ""
            echo "=== CARI SETTINGS GRADLE ==="

            find "$CAP_PROJECT_DIR" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print \
              || true

            echo ""
            echo "=== PROJECT TREE ==="

            find "$CAP_PROJECT_DIR" \
              -maxdepth 5 \
              -print \
              | sed -n '1,300p'

            exit 1

          fi

          echo ""
          echo "✅ Android directory ditemukan:"
          echo "$ANDROID_DIR"

          echo "CAP_ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          # =====================================================
          # VERIFY GRADLE WRAPPER
          # =====================================================

          if [ -f "$ANDROID_DIR/gradlew" ]; then

            echo "✅ gradlew ditemukan."

            chmod +x "$ANDROID_DIR/gradlew"

          else

            echo ""
            echo "❌ gradlew tidak ditemukan:"
            echo "$ANDROID_DIR/gradlew"

            exit 1

          fi

          # =====================================================
          # VERIFY CORDOVA GENERATED FILE
          # =====================================================

          CORDOVA_FILE="$ANDROID_DIR/capacitor-cordova-android-plugins/cordova.variables.gradle"

          if [ -f "$CORDOVA_FILE" ]; then

            echo ""
            echo "✅ cordova.variables.gradle ditemukan:"
            echo "$CORDOVA_FILE"

          else

            echo ""
            echo "ℹ️ cordova.variables.gradle tidak ditemukan."

            echo "Project mungkin tidak menggunakan Cordova plugins."

          fi

          echo ""
          echo "=== CAPACITOR GENERATED FILES ==="

          find "$ANDROID_DIR" \
            -type f \
            \( \
              -name "cordova.variables.gradle" \
              -o -name "variables.gradle" \
              -o -name "capacitor.variables.gradle" \
              -o -name "capacitor.build.gradle" \
            \) \
            -print \
            | sort \
            || true

          echo ""
          echo "=========================================="
          echo "       CAPACITOR PREPARATION OK"
          echo "=========================================="

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # =========================================================
      # FLUTTER
      # =========================================================
      - name: Setup Flutter
        if: ${{ inputs.project_type == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # =========================================================
      # CHECK PROJECT
      # =========================================================
      - name: Check Project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          PROJECT CONFIGURATION"
          echo "=========================================="

          echo "Platform : ${{ inputs.project_type }}"
          echo "Build    : ${{ inputs.build_type }}"
          echo "Tag      : ${{ inputs.tag }}"
          echo "Analyze  : ${{ inputs.only_analyze }}"
          echo "Root     : $PROJECT_DIR"

          # =====================================================
          # FLUTTER
          # =====================================================

          if [ "${{ inputs.project_type }}" = "flutter" ]; then

            cd "$PROJECT_DIR"

            if [ ! -f pubspec.yaml ]; then

              echo "❌ pubspec.yaml tidak ditemukan!"

              exit 1

            fi

            echo "✅ Flutter project valid"

          # =====================================================
          # ANDROID
          # =====================================================

          else

            # Capacitor
            if [ -n "${CAP_ANDROID_DIR:-}" ]; then

              ANDROID_BUILD_DIR="$CAP_ANDROID_DIR"

            else

              # Android Gradle biasa
              if [ -f "$PROJECT_DIR/gradlew" ]; then

                ANDROID_BUILD_DIR="$PROJECT_DIR"

              else

                FOUND_GRADLEW=$(
                  find "$PROJECT_DIR" \
                    -maxdepth 3 \
                    -type f \
                    -name "gradlew" \
                    -print -quit \
                    || true
                )

                if [ -z "$FOUND_GRADLEW" ]; then

                  echo "❌ gradlew tidak ditemukan!"

                  exit 1

                fi

                ANDROID_BUILD_DIR="$(dirname "$FOUND_GRADLEW")"

              fi

            fi

            echo ""
            echo "Android build directory:"
            echo "$ANDROID_BUILD_DIR"

            if [ ! -f "$ANDROID_BUILD_DIR/gradlew" ]; then

              echo "❌ gradlew tidak ditemukan:"
              echo "$ANDROID_BUILD_DIR/gradlew"

              exit 1

            fi

            chmod +x "$ANDROID_BUILD_DIR/gradlew"

            echo "ANDROID_BUILD_DIR=$ANDROID_BUILD_DIR" >> "$GITHUB_ENV"

            echo "✅ Android project valid"

          fi

      # =========================================================
      # FLUTTER ANALYZE
      # =========================================================
      - name: Analyze Flutter
        if: ${{ inputs.project_type == 'flutter' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get

          flutter analyze

      # =========================================================
      # ANDROID ANALYZE
      # =========================================================
      - name: Analyze Android
        if: ${{ inputs.project_type == 'android' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x "$ANDROID_BUILD_DIR/gradlew"

          echo "=========================================="
          echo "          ANDROID ANALYZE"
          echo "=========================================="

          cd "$ANDROID_BUILD_DIR"

          ./gradlew tasks \
            --no-daemon \
            --stacktrace

      # =========================================================
      # STOP ANALYZE ONLY
      # =========================================================
      - name: Stop if Analyze Only
        if: ${{ inputs.only_analyze }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          ANALYZE ONLY"
          echo "=========================================="

          echo "Analyze selesai."
          echo "Build APK dilewati."

      # =========================================================
      # FLUTTER PUB GET
      # =========================================================
      - name: Flutter Pub Get
        if: ${{ inputs.project_type == 'flutter' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get

      # =========================================================
      # ANDROID GRADLE DEPENDENCIES
      # =========================================================
      - name: Android Gradle Dependencies
        if: ${{ inputs.project_type == 'android' && !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x "$ANDROID_BUILD_DIR/gradlew"

          echo "=========================================="
          echo "      ANDROID GRADLE DEPENDENCIES"
          echo "=========================================="

          cd "$ANDROID_BUILD_DIR"

          ./gradlew dependencies \
            --no-daemon \
            --stacktrace

      # =========================================================
      # BUILD FLUTTER
      # =========================================================
      - name: Build Flutter APK
        if: ${{ inputs.project_type == 'flutter' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "${{ inputs.build_type }}" in

            debug)

              echo "🚀 Building Flutter DEBUG..."

              flutter build apk --debug

              ;;

            release)

              echo "🚀 Building Flutter RELEASE..."

              flutter build apk --release

              ;;

            *)

              echo "❌ Build type tidak valid"

              exit 1

              ;;

          esac

      # =========================================================
      # BUILD ANDROID / CAPACITOR
      # =========================================================
      - name: Build Android APK
        if: ${{ inputs.project_type == 'android' && !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x "$ANDROID_BUILD_DIR/gradlew"

          cd "$ANDROID_BUILD_DIR"

          echo "=========================================="
          echo "          BUILD ANDROID APK"
          echo "=========================================="

          echo "Android directory:"
          pwd

          echo ""
          echo "Build type:"
          echo "${{ inputs.build_type }}"

          case "${{ inputs.build_type }}" in

            debug)

              echo ""
              echo "🚀 Building Android DEBUG..."

              ./gradlew assembleDebug \
                --no-daemon \
                --stacktrace

              ;;

            release)

              echo ""
              echo "🚀 Building Android RELEASE..."

              ./gradlew assembleRelease \
                --no-daemon \
                --stacktrace

              ;;

            *)

              echo "❌ Build type tidak valid"

              exit 1

              ;;

          esac

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        if: ${{ !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "             APK SCANNER"
          echo "=========================================="

          mapfile -t APKS < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.apk" \
              -print \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then

            echo "❌ APK tidak ditemukan!"

            echo ""
            echo "=== BUILD/OUTPUT DIRECTORIES ==="

            find "$GITHUB_WORKSPACE" \
              -type d \
              \( \
                -name build \
                -o -name outputs \
              \) \
              -print \
              | sed -n '1,250p'

            echo ""
            echo "=== ALL APK CANDIDATES ==="

            find "$GITHUB_WORKSPACE" \
              -type f \
              | grep -Ei '\.apk$' \
              || true

            exit 1

          fi

          echo ""
          echo "APK ditemukan:"

          printf '%s\n' "${APKS[@]}"

          # =====================================================
          # PILIH APK
          # =====================================================

          APK_FOUND=""

          if [ "${{ inputs.build_type }}" = "release" ]; then

            for apk in "${APKS[@]}"; do

              if [[ "$apk" == *"release"* ]]; then

                APK_FOUND="$apk"
                break

              fi

            done

          else

            for apk in "${APKS[@]}"; do

              if [[ "$apk" == *"debug"* ]]; then

                APK_FOUND="$apk"
                break

              fi

            done

          fi

          # Fallback
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND="${APKS[0]}"
          fi

          echo ""
          echo "APK terpilih:"
          echo "$APK_FOUND"

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"

          echo "APK_NAME=$(basename "$APK_FOUND")" >> "$GITHUB_ENV"

          echo ""

          ls -lh "$APK_FOUND"

      # =========================================================
      # PREPARE OUTPUT
      # =========================================================
      - name: Prepare APK
        if: ${{ !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          FINAL_NAME="${{ inputs.tag }}-${{ inputs.project_type }}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/$FINAL_NAME"

          echo "=========================================="
          echo "             FINAL APK"
          echo "=========================================="

          ls -lh "$GITHUB_WORKSPACE/output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload APK Artifact
        if: ${{ !inputs.only_analyze }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_type }}-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error

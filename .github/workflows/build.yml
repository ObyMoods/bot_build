name: Build Flutter / Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      project_type:
        description: "Pilih platform build"
        required: true
        type: choice
        default: flutter
        options:
          - flutter
          - android

      build_type:
        description: "Pilih mode build"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya analyze, tanpa build"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================================================
      # DOWNLOAD
      # =========================================================
      - name: Download ZIP project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          DOWNLOAD PROJECT"
          echo "=========================================="
          echo "Platform : ${{ inputs.project_type }}"
          echo "Build    : ${{ inputs.build_type }}"
          echo "Tag      : ${{ inputs.tag }}"

          curl -fL --retry 3 --retry-all-errors             -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}"             -H "Accept: application/octet-stream"             "${{ inputs.zip_url }}"             -o project.zip

          test -s project.zip
          ls -lh project.zip
          file project.zip

      # =========================================================
      # VERIFY + EXTRACT
      #
      # unzip sometimes returns exit code 1 for warnings even
      # when the archive was successfully extracted. Therefore:
      # 1. test archive first
      # 2. extract
      # 3. verify files exist
      # =========================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          VERIFY + EXTRACT ZIP"
          echo "=========================================="

          echo "=== ZIP TEST ==="
          unzip -t project.zip

          rm -rf project_raw
          mkdir -p project_raw

          echo ""
          echo "=== EXTRACTING ==="

          set +e
          unzip -o project.zip -d project_raw
          UNZIP_STATUS=$?
          set -e

          echo ""
          echo "unzip exit code: $UNZIP_STATUS"

          # Some unzip builds return 1 because of warnings after
          # successfully extracting the archive. The archive has
          # already passed `unzip -t`, so do not fail here.
          if [ "$UNZIP_STATUS" -ne 0 ]; then
            echo "⚠️ unzip mengembalikan warning/status $UNZIP_STATUS."
            echo "Melanjutkan karena ZIP sudah lolos unzip -t."
          fi

          FILE_COUNT=$(find project_raw -type f | wc -l | tr -d ' ')

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Tidak ada file yang berhasil diekstrak!"
            exit 1
          fi

          echo ""
          echo "✅ File extracted: $FILE_COUNT"

          echo ""
          echo "=== STRUKTUR PROJECT ==="
          find project_raw -maxdepth 4 -type f -print | sed -n '1,200p'

      # =========================================================
      # FIND PROJECT ROOT
      # =========================================================
      - name: Detect Project Root
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          DETECT PROJECT ROOT"
          echo "=========================================="

          PROJECT_DIR=""

          if [ "${{ inputs.project_type }}" = "flutter" ]; then
            echo "Mencari pubspec.yaml..."

            if [ -f "project_raw/pubspec.yaml" ]; then
              PROJECT_DIR="project_raw"
            else
              PUBSPEC=$(find project_raw                 -type f                 -name "pubspec.yaml"                 -print -quit || true)

              if [ -n "$PUBSPEC" ]; then
                PROJECT_DIR="$(dirname "$PUBSPEC")"
              fi
            fi

          else
            echo "Mencari Android/Gradle project..."

            if [ -f "project_raw/gradlew" ]; then
              PROJECT_DIR="project_raw"
            else
              GRADLEW=$(find project_raw                 -type f                 -name "gradlew"                 -print -quit || true)

              if [ -n "$GRADLEW" ]; then
                PROJECT_DIR="$(dirname "$GRADLEW")"
              fi
            fi

            # Fallback untuk project Android yang wrapper-nya berada
            # di root tetapi file executable hilang.
            if [ -z "$PROJECT_DIR" ]; then
              GRADLE_BUILD=$(find project_raw                 -type f                 \( -name "settings.gradle"                 -o -name "settings.gradle.kts"                 \)                 -print -quit || true)

              if [ -n "$GRADLE_BUILD" ]; then
                PROJECT_DIR="$(dirname "$GRADLE_BUILD")"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "❌ PROJECT ROOT TIDAK DITEMUKAN!"
            echo "Platform: ${{ inputs.project_type }}"

            echo ""
            echo "=== CANDIDATE FILES ==="
            find project_raw -type f               \( -name "pubspec.yaml"               -o -name "gradlew"               -o -name "settings.gradle"               -o -name "settings.gradle.kts"               \)               -print | sed -n '1,100p'

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # FLUTTER
      # =========================================================
      - name: Setup Flutter
        if: ${{ inputs.project_type == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      # =========================================================
      # CHECK PROJECT
      # =========================================================
      - name: Check Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          PROJECT CONFIGURATION"
          echo "=========================================="

          echo "Platform : ${{ inputs.project_type }}"
          echo "Build    : ${{ inputs.build_type }}"
          echo "Tag      : ${{ inputs.tag }}"
          echo "Analyze  : ${{ inputs.only_analyze }}"
          echo "Root     : $PWD"

          if [ "${{ inputs.project_type }}" = "flutter" ]; then
            test -f pubspec.yaml || {
              echo "❌ pubspec.yaml tidak ditemukan!"
              exit 1
            }
            echo "✅ Flutter project valid"

          else
            if [ ! -f gradlew ]; then
              echo "❌ gradlew tidak ditemukan!"
              echo "Project Android harus menyertakan Gradle Wrapper."
              exit 1
            fi

            chmod +x gradlew
            echo "✅ Android/Gradle project valid"
          fi

      # =========================================================
      # FLUTTER ANALYZE
      # =========================================================
      - name: Analyze Flutter
        if: ${{ inputs.project_type == 'flutter' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          flutter pub get
          flutter analyze

      # =========================================================
      # ANDROID ANALYZE
      # =========================================================
      - name: Analyze Android
        if: ${{ inputs.project_type == 'android' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x gradlew
          ./gradlew tasks --no-daemon

      # =========================================================
      # STOP ANALYZE ONLY
      # =========================================================
      - name: Stop if Analyze Only
        if: ${{ inputs.only_analyze }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          ANALYZE ONLY"
          echo "=========================================="
          echo "Analyze selesai. Build APK dilewati."

      # =========================================================
      # FLUTTER DEPENDENCIES
      # =========================================================
      - name: Flutter Pub Get
        if: ${{ inputs.project_type == 'flutter' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get

      # =========================================================
      # ANDROID DEPENDENCIES
      # =========================================================
      - name: Android Gradle Dependencies
        if: ${{ inputs.project_type == 'android' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x gradlew
          ./gradlew dependencies --no-daemon

      # =========================================================
      # BUILD FLUTTER
      # =========================================================
      - name: Build Flutter APK
        if: ${{ inputs.project_type == 'flutter' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          case "${{ inputs.build_type }}" in
            debug)
              echo "🚀 Building Flutter DEBUG..."
              flutter build apk --debug
              ;;
            release)
              echo "🚀 Building Flutter RELEASE..."
              flutter build apk --release
              ;;
            *)
              echo "❌ Build type tidak valid"
              exit 1
              ;;
          esac

      # =========================================================
      # BUILD ANDROID STUDIO / GRADLE
      # =========================================================
      - name: Build Android Studio APK
        if: ${{ inputs.project_type == 'android' && !inputs.only_analyze }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x gradlew

          case "${{ inputs.build_type }}" in
            debug)
              echo "🚀 Building Android DEBUG..."
              ./gradlew assembleDebug --no-daemon
              ;;
            release)
              echo "🚀 Building Android RELEASE..."
              ./gradlew assembleRelease --no-daemon
              ;;
            *)
              echo "❌ Build type tidak valid"
              exit 1
              ;;
          esac

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        if: ${{ !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "             APK SCANNER"
          echo "=========================================="

          mapfile -t APKS < <(
            find "$GITHUB_WORKSPACE"               -type f               -name "*.apk"               -print
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "❌ APK tidak ditemukan!"

            echo ""
            echo "=== BUILD/OUTPUT DIRECTORIES ==="
            find "$GITHUB_WORKSPACE"               -type d               \( -name build -o -name outputs \)               -print | sed -n '1,200p'

            exit 1
          fi

          echo "APK ditemukan:"
          printf '%s\n' "${APKS[@]}"

          # Pilih APK pertama. Untuk project yang menghasilkan beberapa
          # APK, scanner tetap menampilkan semuanya.
          APK_FOUND="${APKS[0]}"

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$APK_FOUND")" >> "$GITHUB_ENV"

          ls -lh "$APK_FOUND"

      # =========================================================
      # PREPARE OUTPUT
      # =========================================================
      - name: Prepare APK
        if: ${{ !inputs.only_analyze }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          FINAL_NAME="${{ inputs.tag }}-${{ inputs.project_type }}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/$FINAL_NAME"

          echo "=========================================="
          echo "             FINAL APK"
          echo "=========================================="

          ls -lh "$GITHUB_WORKSPACE/output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload APK Artifact
        if: ${{ !inputs.only_analyze }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_type }}-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error

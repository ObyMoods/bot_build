name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter/Android"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # =========================================================
      # NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================================================
      # DOWNLOAD ZIP
      # =========================================================
      - name: Download ZIP project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        DOWNLOAD PROJECT ZIP"
          echo "=========================================="

          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== ZIP Header ==="
          xxd -l 32 project.zip

            # =========================================================
      # EXTRACT
      # =========================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          EXTRACT PROJECT"
          echo "=========================================="

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== TEST ZIP ==="

          if ! unzip -t project.zip; then
            echo ""
            echo "❌ ZIP GAGAL DIVERIFIKASI!"
            echo ""
            echo "=== HEADER ==="
            xxd -l 32 project.zip || true
            echo ""
            echo "=== FILE INFO ==="
            file project.zip
            exit 1
          fi

          echo ""
          echo "✅ ZIP VALID"

          rm -rf project_raw
          mkdir -p project_raw

          echo ""
          echo "=== EXTRACTING ==="

          unzip -o project.zip -d project_raw

          echo ""
          echo "✅ EXTRACT BERHASIL"

          echo ""
          echo "=== STRUKTUR PROJECT ==="
          find project_raw -maxdepth 3 -type f -print | head -100

          echo ""
          echo "=== CARI PROJECT ROOT ==="

          PROJECT_DIR=""

          # Flutter root langsung
          if [ -f "project_raw/pubspec.yaml" ]; then
            PROJECT_DIR="project_raw"

          # Flutter berada di dalam folder
          elif find project_raw \
              -mindepth 2 \
              -maxdepth 4 \
              -type f \
              -name "pubspec.yaml" \
              -print -quit | grep -q .; then

            PUBSPEC=$(find project_raw \
              -mindepth 2 \
              -maxdepth 4 \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)

            PROJECT_DIR=$(dirname "$PUBSPEC")

          # Gradle root langsung
          elif [ -f "project_raw/gradlew" ]; then
            PROJECT_DIR="project_raw"

          # Gradle berada di dalam folder
          elif find project_raw \
              -type f \
              -name "gradlew" \
              -print -quit | grep -q .; then

            GRADLEW=$(find project_raw \
              -type f \
              -name "gradlew" \
              -print -quit)

            PROJECT_DIR=$(dirname "$GRADLEW")

          else
            echo ""
            echo "❌ TIDAK MENEMUKAN PROJECT!"
            echo ""
            echo "Mencari:"
            echo "  - pubspec.yaml"
            echo "  - gradlew"
            echo ""
            echo "=== STRUKTUR LENGKAP ==="
            find project_raw -maxdepth 5 -print
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "✅ pubspec.yaml ditemukan"
          fi

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "✅ gradlew ditemukan"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

            # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # =========================================================
      # FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # =========================================================
      # DETECT PROJECT TYPE
      # =========================================================
      - name: Detect Project Type
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          PROJECT DETECTION"
          echo "=========================================="

          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_TYPE=flutter" >> "$GITHUB_ENV"
            echo "✅ Flutter project detected"

          elif [ -f "gradlew" ]; then
            echo "PROJECT_TYPE=gradle" >> "$GITHUB_ENV"
            echo "✅ Gradle / Android Studio project detected"

          elif find . -maxdepth 3 -name "build.gradle" \
              -o -name "build.gradle.kts" | grep -q .; then
            echo "PROJECT_TYPE=gradle" >> "$GITHUB_ENV"
            echo "✅ Gradle project detected"

          else
            echo "❌ Unknown project type"
            exit 1
          fi

      # =========================================================
      # FLUTTER ANALYZE
      # =========================================================
      - name: Analyze Flutter Project
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          FLUTTER ANALYZE"
          echo "=========================================="

          flutter pub get

          flutter analyze > analyze_report.txt 2>&1 || true

          echo ""
          echo "[RESULT_ANALYZE]"
          cat analyze_report.txt
          echo "[END_RESULT_ANALYZE]"

          rm -f analyze_report.txt

      # =========================================================
      # GRADLE ANALYZE / CHECK
      # =========================================================
      - name: Analyze Gradle Project
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          GRADLE ANALYZE"
          echo "=========================================="

          if [ ! -f "gradlew" ]; then
            echo "❌ gradlew tidak ditemukan"
            exit 1
          fi

          chmod +x gradlew

          echo "Running Gradle validation..."

          ./gradlew tasks --no-daemon || true

          echo ""
          echo "Gradle project berhasil dideteksi."

      # =========================================================
      # STOP ANALYZE ONLY
      # =========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        shell: bash
        run: |
          echo "=========================================="
          echo "        ANALYZE ONLY MODE"
          echo "=========================================="

          echo "Analyze selesai."
          echo "Build APK dilewati."

          exit 0

      # =========================================================
      # FLUTTER DOCTOR
      # =========================================================
      - name: Flutter Doctor
        if: env.PROJECT_TYPE == 'flutter'
        run: |
          flutter doctor -v

      # =========================================================
      # FLUTTER DEPENDENCIES
      # =========================================================
      - name: Flutter Pub Get
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

      # =========================================================
      # GRADLE DEPENDENCIES
      # =========================================================
      - name: Gradle Dependencies
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          GRADLE DEPENDENCIES"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew dependencies --no-daemon

      # =========================================================
      # BUILD FLUTTER
      # =========================================================
      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "          BUILD FLUTTER APK"
          echo "=========================================="

          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug

          elif [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release

          else
            echo "❌ Build type tidak valid: $BUILD_TYPE"
            exit 1
          fi

      # =========================================================
      # BUILD ANDROID / GRADLE
      # =========================================================
      - name: Build Android Gradle APK
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=========================================="
          echo "       BUILD ANDROID / GRADLE APK"
          echo "=========================================="

          chmod +x gradlew

          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "🚀 Running assembleDebug..."
            ./gradlew assembleDebug --no-daemon

          elif [ "$BUILD_TYPE" = "release" ]; then
            echo "🚀 Running assembleRelease..."
            ./gradlew assembleRelease --no-daemon

          else
            echo "❌ Build type tidak valid!"
            exit 1
          fi

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        shell: bash
        run: |
          echo "=========================================="
          echo "             APK SCANNER"
          echo "=========================================="

          echo ""
          echo "Mencari semua APK..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo ""
            echo "❌ APK tidak ditemukan!"
            echo ""
            echo "=== Folder build ==="
            find "$GITHUB_WORKSPACE" \
              -type d \
              \( -name build -o -name outputs \) \
              -print
            exit 1
          fi

          echo ""
          echo "✅ APK ditemukan:"
          echo "$APK_FOUND"

          APK_NAME=$(basename "$APK_FOUND")

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "=== APK Info ==="
          ls -lh "$APK_FOUND"

      # =========================================================
      # COPY APK KE OUTPUT
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/${{ github.event.inputs.tag }}-${{ github.event.inputs.build_type }}.apk"

          echo ""
          echo "=== Final APK ==="
          ls -lh "$GITHUB_WORKSPACE/output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error

name: Build Flutter / Android APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter/Android"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      project_type:
        description: "Pilih jenis project"
        required: true
        type: choice
        default: flutter
        options:
          - flutter
          - android

      build_type:
        description: "Pilih mode build"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # =========================================================
      # NODE.JS
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================================================
      # DOWNLOAD ZIP
      # =========================================================
      - name: Download ZIP project
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "        DOWNLOAD PROJECT ZIP"
          echo "=========================================="

          echo "Project type : ${{ inputs.project_type }}"
          echo "Build type   : ${{ inputs.build_type }}"
          echo "Tag          : ${{ inputs.tag }}"
          echo "URL          : ${{ inputs.zip_url }}"

          curl -fL \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}" \
            -o project.zip

          ls -lh project.zip
          file project.zip
          xxd -l 32 project.zip

      # =========================================================
      # EXTRACT ZIP
      # =========================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          EXTRACT PROJECT"
          echo "=========================================="

          if ! unzip -t project.zip; then
            echo "❌ ZIP GAGAL DIVERIFIKASI!"
            file project.zip
            xxd -l 32 project.zip || true
            exit 1
          fi

          echo "✅ ZIP VALID"

          rm -rf project_raw
          mkdir -p project_raw

          unzip -o project.zip -d project_raw

          echo ""
          echo "=== STRUKTUR AWAL ==="

          find project_raw \
            -maxdepth 4 \
            -type f \
            -print | sed -n '1,150p'

          echo ""
          echo "=== MENCARI PROJECT ROOT ==="

          PROJECT_DIR=""

          if [ "${{ inputs.project_type }}" = "flutter" ]; then

            if [ -f "project_raw/pubspec.yaml" ]; then
              PROJECT_DIR="project_raw"
            else
              PUBSPEC=$(find project_raw \
                -mindepth 2 \
                -maxdepth 6 \
                -type f \
                -name "pubspec.yaml" \
                -print -quit || true)

              if [ -n "$PUBSPEC" ]; then
                PROJECT_DIR=$(dirname "$PUBSPEC")
              fi
            fi

          elif [ "${{ inputs.project_type }}" = "android" ]; then

            if [ -f "project_raw/gradlew" ]; then
              PROJECT_DIR="project_raw"
            else
              GRADLEW=$(find project_raw \
                -mindepth 2 \
                -maxdepth 6 \
                -type f \
                -name "gradlew" \
                -print -quit || true)

              if [ -n "$GRADLEW" ]; then
                PROJECT_DIR=$(dirname "$GRADLEW")
              fi
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ PROJECT ROOT TIDAK DITEMUKAN!"

            echo ""
            echo "Project type yang dipilih:"
            echo "${{ inputs.project_type }}"

            echo ""
            echo "Pastikan:"
            if [ "${{ inputs.project_type }}" = "flutter" ]; then
              echo "- pubspec.yaml tersedia"
            else
              echo "- gradlew tersedia"
              echo "- atau project Gradle Android memiliki wrapper"
            fi

            echo ""
            echo "=== STRUKTUR PROJECT ==="

            find project_raw \
              -maxdepth 6 \
              -print | sed -n '1,300p'

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"
          echo "=========================================="

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # JAVA - DIPAKAI FLUTTER & ANDROID
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================================================
      # ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================================
      # FLUTTER - HANYA UNTUK FLUTTER
      # =========================================================
      - name: Setup Flutter
        if: ${{ inputs.project_type == 'flutter' }}
        uses: subosito/flutter-action@main
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # =========================================================
      # CHECK PROJECT
      # =========================================================
      - name: Check Project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          PROJECT CONFIGURATION"
          echo "=========================================="

          echo "Project Type : ${{ inputs.project_type }}"
          echo "Build Type   : ${{ inputs.build_type }}"
          echo "Tag          : ${{ inputs.tag }}"
          echo "Analyze Only : ${{ inputs.only_analyze }}"
          echo "Project Root : $PWD"

          if [ "${{ inputs.project_type }}" = "flutter" ]; then

            if [ ! -f "pubspec.yaml" ]; then
              echo "❌ pubspec.yaml tidak ditemukan!"
              exit 1
            fi

            echo "✅ Flutter project valid"

          else

            if [ ! -f "gradlew" ]; then
              echo "❌ gradlew tidak ditemukan!"
              echo "Project Android harus mempunyai Gradle Wrapper."
              exit 1
            fi

            chmod +x gradlew

            echo "✅ Android/Gradle project valid"

          fi

      # =========================================================
      # FLUTTER ANALYZE
      # =========================================================
      - name: Analyze Flutter Project
        if: ${{ inputs.project_type == 'flutter' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          FLUTTER ANALYZE"
          echo "=========================================="

          flutter pub get

          echo ""
          echo "=== FLUTTER ANALYZE RESULT ==="

          flutter analyze

      # =========================================================
      # ANDROID / GRADLE ANALYZE
      # =========================================================
      - name: Analyze Android Project
        if: ${{ inputs.project_type == 'android' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          ANDROID ANALYZE"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew tasks --no-daemon

          echo ""
          echo "✅ Android Gradle project berhasil divalidasi."

      # =========================================================
      # STOP ANALYZE ONLY
      # =========================================================
      - name: Stop if Analyze Only
        if: ${{ inputs.only_analyze == true }}
        shell: bash
        run: |
          echo "=========================================="
          echo "        ANALYZE ONLY MODE"
          echo "=========================================="

          echo "Analyze selesai."
          echo "Build APK dilewati."

          exit 0

      # =========================================================
      # FLUTTER DOCTOR
      # =========================================================
      - name: Flutter Doctor
        if: ${{ inputs.project_type == 'flutter' }}
        shell: bash
        run: |
          flutter doctor -v

      # =========================================================
      # FLUTTER DEPENDENCIES
      # =========================================================
      - name: Flutter Pub Get
        if: ${{ inputs.project_type == 'flutter' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          FLUTTER PUB GET"
          echo "=========================================="

          flutter pub get

      # =========================================================
      # ANDROID DEPENDENCIES
      # =========================================================
      - name: Android Gradle Dependencies
        if: ${{ inputs.project_type == 'android' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "       ANDROID GRADLE DEPENDENCIES"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew dependencies --no-daemon

      # =========================================================
      # BUILD FLUTTER
      # =========================================================
      - name: Build Flutter APK
        if: ${{ inputs.project_type == 'flutter' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "          BUILD FLUTTER APK"
          echo "=========================================="

          BUILD_TYPE="${{ inputs.build_type }}"

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            echo "🚀 Flutter DEBUG"
            flutter build apk --debug

          elif [ "$BUILD_TYPE" = "release" ]; then

            echo "🚀 Flutter RELEASE"
            flutter build apk --release

          else

            echo "❌ Build type tidak valid: $BUILD_TYPE"
            exit 1

          fi

      # =========================================================
      # BUILD ANDROID STUDIO / GRADLE
      # =========================================================
      - name: Build Android Studio APK
        if: ${{ inputs.project_type == 'android' }}
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "       BUILD ANDROID STUDIO APK"
          echo "=========================================="

          chmod +x gradlew

          BUILD_TYPE="${{ inputs.build_type }}"

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            echo "🚀 Android Studio DEBUG"
            ./gradlew assembleDebug --no-daemon

          elif [ "$BUILD_TYPE" = "release" ]; then

            echo "🚀 Android Studio RELEASE"
            ./gradlew assembleRelease --no-daemon

          else

            echo "❌ Build type tidak valid!"
            exit 1

          fi

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "             APK SCANNER"
          echo "=========================================="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print > apk_list.txt

          echo ""
          echo "=== APK YANG DITEMUKAN ==="

          cat apk_list.txt || true

          APK_FOUND=$(sed -n '1p' apk_list.txt)

          if [ -z "$APK_FOUND" ]; then

            echo ""
            echo "❌ APK tidak ditemukan!"

            echo ""
            echo "=== FOLDER BUILD ==="

            find "$GITHUB_WORKSPACE" \
              -type d \
              \( -name build -o -name outputs \) \
              -print | sed -n '1,200p'

            exit 1
          fi

          echo ""
          echo "✅ APK ditemukan:"
          echo "$APK_FOUND"

          APK_NAME=$(basename "$APK_FOUND")

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

          ls -lh "$APK_FOUND"

          rm -f apk_list.txt

      # =========================================================
      # COPY APK KE OUTPUT
      # =========================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          FINAL_NAME="${{ inputs.tag }}-${{ inputs.project_type }}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/output/$FINAL_NAME"

          echo ""
          echo "=== FINAL APK ==="

          ls -lh "$GITHUB_WORKSPACE/output"

      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_type }}-${{ inputs.build_type }}-${{ inputs.tag }}
          path: output/*.apk
          retention-days: 1
          if-no-files-found: error
